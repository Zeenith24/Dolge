<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolge – Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>*, body, h1, h2, h3, h4, h5, h6, p, span, button, input, textarea, a, label { font-family: 'Courier Prime', monospace !important; } .material-symbols-outlined { font-family: 'Material Symbols Outlined' !important; }</style>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/static/tailwind-config.js"></script>
</head>
<body class="bg-background text-on-surface parchment-grid min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-md">
  <div class="relative -rotate-1 mx-auto w-fit mb-6">
    <div class="absolute -top-2.5 left-2 w-10 h-4 bg-secondary-fixed/90 -rotate-6 z-20 border border-outline/30"></div>
    <div class="bg-surface-container-lowest px-4 py-2 rounded tactile-shadow border-2 border-on-surface">
      <div class="text-2xl font-bold leading-none" style="font-family:'Bricolage Grotesque' !important">Dolge</div>
      <div class="text-[9px] uppercase tracking-widest text-primary font-bold">Cartography Desk</div>
    </div>
  </div>

  <div class="relative bg-[#fffdf0] rounded-xl border-2 border-on-surface tactile-shadow-lg p-6">
    <div class="absolute -top-3 left-8 w-6 h-6 rounded-full bg-error border-2 border-on-surface tactile-shadow-sm flex items-center justify-center z-20"><div class="w-2 h-2 rounded-full bg-surface-container-lowest"></div></div>
    <div class="flex gap-1.5 bg-surface-container-highest/70 p-1 rounded-md border border-outline-variant mb-5">
      <button id="tab-login" type="button" class="flex-1 py-1.5 rounded text-xs font-bold uppercase bg-surface-container-lowest border-2 border-on-surface tactile-shadow-sm">Log in</button>
      <button id="tab-register" type="button" class="flex-1 py-1.5 rounded text-xs font-bold uppercase text-on-surface-variant">Create account</button>
    </div>

    <form id="form" class="space-y-3" novalidate>
      <div id="name-row" class="hidden">
        <label for="name" class="text-xs font-bold uppercase block mb-1">Name</label>
        <input id="name" autocomplete="name" maxlength="80" class="w-full rounded border-2 border-on-surface bg-surface-container-lowest text-sm">
      </div>
      <div>
        <label for="email" class="text-xs font-bold uppercase block mb-1">Email</label>
        <input id="email" type="email" autocomplete="email" class="w-full rounded border-2 border-on-surface bg-surface-container-lowest text-sm">
      </div>
      <div>
        <label for="password" class="text-xs font-bold uppercase block mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" class="w-full rounded border-2 border-on-surface bg-surface-container-lowest text-sm">
        <p id="pw-hint" class="hidden text-[11px] text-on-surface-variant mt-1">At least 8 characters.</p>
      </div>
      <p id="error" class="hidden text-xs font-bold text-error bg-error-container border border-error rounded px-2 py-1"></p>
      <button id="submit" class="w-full bg-primary hover:bg-primary-container text-on-primary hover:text-on-primary-container py-3 rounded-lg font-bold uppercase tracking-wide tactile-shadow border-2 border-on-surface active:translate-x-0.5 active:translate-y-0.5">Log in</button>
    </form>
    <p id="bonus" class="hidden text-[11px] text-center text-on-surface-variant mt-3">🎟️ New accounts start with 24 reel credits.</p>
  </div>
</main>

<script src="/static/common.js"></script>
<script>
let mode = 'login';
const $ = id => document.getElementById(id);
const ACTIVE = ['bg-surface-container-lowest', 'border-2', 'border-on-surface', 'tactile-shadow-sm'];

function setMode(m) {
  mode = m;
  for (const [id, name] of [['tab-login', 'login'], ['tab-register', 'register']]) {
    ACTIVE.forEach(c => $(id).classList.toggle(c, m === name));
    $(id).classList.toggle('text-on-surface-variant', m !== name);
  }
  $('name-row').classList.toggle('hidden', m !== 'register');
  $('pw-hint').classList.toggle('hidden', m !== 'register');
  $('bonus').classList.toggle('hidden', m !== 'register');
  $('password').autocomplete = m === 'register' ? 'new-password' : 'current-password';
  $('submit').textContent = m === 'register' ? 'Create account' : 'Log in';
  $('error').classList.add('hidden');
}
$('tab-login').onclick = () => setMode('login');
$('tab-register').onclick = () => setMode('register');

function showError(msg) { $('error').textContent = msg; $('error').classList.remove('hidden'); }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('error').classList.add('hidden');
  const email = $('email').value.trim(), password = $('password').value, name = $('name').value.trim();
  if (!email || !password) return showError('Enter your email and password.');
  if (mode === 'register' && !name) return showError('Enter your name.');
  if (mode === 'register' && password.length < 8) return showError('Password must be at least 8 characters.');
  $('submit').disabled = true;
  try {
    await api(mode === 'register' ? '/api/auth/register' : '/api/auth/login',
      { json: mode === 'register' ? { name, email, password } : { email, password } });
    location.href = '/';
  } catch (ex) { showError(ex.message); }
  finally { $('submit').disabled = false; }
});
</script>
</body></html>
